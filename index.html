 if(a=='ab'&&v){if(!V.ab)V.ab={a:v.currentTime,b:null};else if(V.ab.b==null){if(v.currentTime>V.ab.a+0.05)V.ab.b=v.currentTime}else V.ab=null;el.className=V.ab?'on':'';el.textContent=V.ab?(V.ab.b!=null?'A–B 해제':'B 지정'):'A–B 반복';return}
 if(a=='memo'&&v){v.pause();const fr=it.fps?Math.round(v.currentTime*it.fps):Math.round(v.currentTime*30);$('#memo').innerHTML=`<div class="memo"><span class="tg">${fr}f${it.fps?'':' (30fps 기준)'}</span><input id="mm" placeholder="이 프레임 메모 후 Enter"></div>`;const m=$('#mm');m.focus();m.onkeydown=ev=>{if(ev.key=='Enter'&&m.value.trim())act({type:'memo',item:it.id,frame:fr,text:m.value.trim()},'메모 '+fr+'f')};return}});
// 검색 입력: 태그 추천 (앞에 - 를 붙이면 제외)
document.addEventListener('input',e=>{if(e.target.id!='q')return;const raw=e.target.value,neg=raw.startsWith('-'),q=raw.replace(/^-/,'').trim().toLowerCase();document.querySelectorAll('.sug').forEach(x=>x.remove());if(!q)return;
 if(!D._tc){D._tc=new Map();D.items.forEach(it=>it.tags.forEach(t=>D._tc.set(t,(D._tc.get(t)||0)+1)))}
 const hit=[...D._tc].filter(([t])=>t.toLowerCase().includes(q)&&!S.tags.includes(t)).sort((a,b)=>b[1]-a[1]).slice(0,8);const s=document.createElement('div');s.className='sug';
 s.innerHTML=hit.map(([t,n])=>`<div data-t="${esc(t)}">${neg?'제외: ':''}${esc(t)}<span>${n}</span></div>`).join('')+`<div data-name="1">이름에 "${esc(raw)}" 포함<span>↵</span></div>`;$('.main').appendChild(s);
 s.onclick=ev=>{const d=ev.target.closest('div[data-t],div[data-name]');if(!d)return;if(d.dataset.t)(neg?S.not:S.tags).push(d.dataset.t),S.text='';else S.text=raw;V._kept=0;save();render();ev.stopPropagation()}});

// ---------- 추출 현황 ----------
const gslug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^the/,'');
function ring(p,sz,sw,col,label){const r=(sz-sw)/2,c=2*Math.PI*r,v=Math.max(0,Math.min(100,p||0));return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#ffffff14" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/>${label!=null?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#f2f2f4" font-size="${sz*0.25}" font-weight="700">${label}</text>`:''}</svg>`}
// 작업의 '부' 설명: 부마다 이름·범위·내용·진행률 (parts.csv)
function partsHTML(W){const PT=W.parts||[];if(!PT.length)return '';const cur=((W.steps||[]).find(s=>s.st=='진행')||{}).part;
 return `<div class="pts">${PT.map(p=>`<div class="pt${p.no==cur?' on':''}"><div class="ptr">${ring(p.pct,40,5,p.pct>=100?'#34c759':'#3e91ff',Math.round(p.pct))}</div><div><b>${esc(p.no)}부 · ${esc(p.name)}</b>${p.no==cur?'<span class="cp on" style="margin-left:6px">지금</span>':''}<p>📦 ${esc(p.scope)}</p><p>🔧 ${esc(p.what)}</p></div></div>`).join('')}</div>`}
function statView(){const st=D.status;const old=$('#stat');const y0=old?old.scrollTop:0;if(old)old.remove();const el=document.createElement('div');el.id='stat';if(!old)el.className='in';let h=`<div class="selh" style="padding:0"><span class="ib" data-a="statx">✕</span><b>추출 현황</b></div>`;
 if(!st)h+='<div class="card">현황 파일이 아직 없습니다.</div>';else{const age=Math.round((Date.now()/1000-st.time)/60),stale=age>5,a=st.auto||{},lv=st.live||{};
  const ws=(st.works||[]),act=ws.filter(w=>!w.done),W=act[0]||ws[0],tot=act.length?act.reduce((s,w)=>s+w.pct,0)/act.length:(ws.length?100:0),col=stale?'#777':(a.color||'#3e91ff');
  // 1) 전체 진행도
  h+=`<div class="card sv1"><div>${ring(tot,132,13,col,Math.round(tot)+'%')}</div><div class="sv1r"><h4>전체 진행도</h4><div class="chips"><span class="cp" style="--c:${col}"><i></i>${stale?'PC 꺼짐':esc((a.label||'').replace('무인 작업 ',''))}</span><span class="cp">📡 ${ago(age)}</span>${st.disk?`<span class="cp">💾 D ${st.disk.D}GB</span>`:''}<span class="cp">🗂 ${(st.items||0).toLocaleString()}</span>${lv.queue!=null?`<span class="cp">⏳ 대기 ${lv.queue}</span>`:''}${(lv.running||[]).length?`<span class="cp">🎬 렌더 ${(lv.running||[]).length}</span>`:''}</div></div></div>`;
  if((st.problems||[]).length)h+=`<div class="card warnc">${st.problems.map(p=>`<div class="row"><b class="warn">⚠ ${esc(p)}</b></div>`).join('')}</div>`;
  // 2) 지금 하고 있는 작업
  if(W){const parts=String(W.now||'').split('|').map(x=>x.trim()),tag=parts[1]||W.name,desc=(parts[2]||parts[0]||'').split(' — ');const mdl=String(lv.model||'').split('|');
   h+=`<div class="card"><h4>지금 하고 있는 작업</h4><div class="nowr"><span class="pulse${stale||W.done?' off':''}"></span><div><div class="nowt"><span class="cp on">${esc(W.title||tag)}</span>${mdl[1]?`<span class="cp">🧠 ${esc(mdl[1])}</span>`:''}<span class="cp">${W.age!=null?ago(W.age):''}</span></div><p class="nowd">${esc(desc[0])}</p>${desc[1]?`<p class="nown">다음 ▸ ${esc(desc.slice(1).join(' — ').slice(0,120))}</p>`:''}</div></div>${partsHTML(W)}</div>`;
   // 3) 단계별 진행도
   const stp=W.steps||[],PT=W.parts||[];const row=L=>`<div class="stp">${L.map((s,i)=>{const d=s.st=='완료'||s.pct>=100,g=!d&&(s.st=='진행'||s.pct>0);return `<div class="sp${d?' d':g?' g':''}">${i?'<u></u>':''}<div class="spc">${d?'✓':g?ring(s.pct,44,5,'#3e91ff',null)+'<em>'+Math.round(s.pct)+'</em>':esc(s.no)}</div><small>${esc(s.name.split(/[(—]/)[0].replace(/^\d부\s*/,'').replace(/^[^:：]*[:：]\s*/,'').replace(/^[\u2460-\u2473\s]+/,'').replace(/^\p{Extended_Pictographic}\s*/u,'').trim().slice(0,12))}</small></div>`}).join('')}</div>`;
   h+=`<div class="card"><h4>단계별 진행도</h4>${PT.length?PT.map(p=>`<div class="pth"><b>${esc(p.no)}부 · ${esc(p.name)}</b><span>${Math.round(p.pct)}%</span></div>`+row(stp.filter(s=>s.part==p.no))).join(''):row(stp)}${(()=>{const c=stp.find(s=>s.st=='진행')||stp.find(s=>s.pct<100);return c?`<p class="nown">${esc(c.no)}단계 · ${esc(c.name.slice(0,110))}</p>`:''})()}</div>`}
  // 4) 게임별 진행도 (클립 수 / 계획 수)
  const plan=(st.targets&&st.targets.plan)||{},ord=(st.targets&&st.targets.order)||{},pk=Object.keys(plan);
  const GN=Object.keys(st.games||{}),exact={};GN.forEach(g=>{const sl=gslug(g);if(pk.includes(sl))exact[g]=sl});const used=new Set(Object.values(exact));
  const cpl=(x,y)=>{let i=0;while(i<x.length&&i<y.length&&x[i]==y[i])i++;return i};
  const G=Object.entries(st.games||{}).map(([g,s])=>{const sl=gslug(g),k=exact[g]||pk.find(x=>!used.has(x)&&cpl(x,sl)>Math.min(x.length,sl.length)*0.8);return {g,s,plan:k?plan[k]:0,ord:k&&ord[k]?ord[k]:999}}).sort((a,b)=>a.ord-b.ord||b.s.clip-a.s.clip);
  h+=`<div class="card"><h4>게임별 진행도 <span class="lg"><i style="background:#5fd68a"></i>계획 달성 <i style="background:#3e91ff"></i>진행 <i style="background:#6b7280"></i>계획 없음</span></h4>${G.filter(x=>x.s.clip||x.plan).map(x=>{const done=x.plan&&x.s.clip>=x.plan,pc=x.plan?Math.min(100,x.s.clip/x.plan*100):100;return `<div class="gb"><div class="gbn"><b>${esc(x.g)}</b><span>${x.s.clip.toLocaleString()}${x.plan?' / '+x.plan.toLocaleString()+' · '+Math.round(x.s.clip/x.plan*100)+'%':' · 계획 없음'}</span></div><div class="gbt"><u class="cl${done?' ok':x.plan?'':' np'}" style="width:${pc}%"></u></div></div>`}).join('')}</div>`;
  // 5) 게임 추출 현황판
  h+=`<div class="card"><h4>게임 추출 현황판 <span class="lg"><i style="background:#5fd68a"></i>완료 <i style="background:#3e91ff"></i>진행 <i style="background:#ffcf6b"></i>이미지만 <i style="background:#555"></i>대기</span></h4><div class="bd">${G.map(x=>{const s=x.s,done=x.plan&&s.clip>=x.plan,c=done?'#5fd68a':s.clip?'#3e91ff':s.img?'#ffcf6b':'#555',p=x.plan?s.clip/x.plan*100:(s.clip?100:0);
   return `<div class="bt" style="--c:${c}"><div class="btr">${ring(p,46,5,c,null)}<em>${done?'✓':x.plan?Math.round(p):s.clip?'🎬':s.img?'🖼':'·'}</em></div><b>${esc(x.g)}</b><span>🖼 ${s.img} · 🎬 ${s.clip}</span>${s.clip_need||s.img_need?`<span class="warn">🤖 ${s.clip_need+s.img_need}</span>`:''}${s.v_ok||s.v_bad?`<span>✓${s.v_ok} ✕${s.v_bad}</span>`:''}</div>`}).join('')}</div></div>`;
  const pend=PEND.length,fail=(st.applied||[]).filter(x=>!x.ok).slice(-5),rq=(st.queue||[]).filter(r=>r['상태']=='요청').slice(-8);
  if(pend||fail.length||rq.length)h+=`<div class="card"><h4>내 요청</h4>${pend?`<div class="row"><b>PC 반영 대기</b><span>${pend}건${PEND.some(a=>a.err)?' · 전송 실패 있음':''}</span></div>`:''}${fail.map(f=>`<div class="row"><b class="bad">반영 실패</b><span>${esc(f.msg)}</span></div>`).join('')}${rq.map(r=>`<div class="row"><b>🎯 ${esc(r['이름'])}</b><span>${esc(r['게임'])} · ${esc(r['시각'].slice(5,16))}</span></div>`).join('')}</div>`}
 el.innerHTML=h;$('#app').appendChild(el);el.scrollTop=y0}
// ---------- 시작·주기 갱신 ----------
async function refresh(first){try{const st=await B.get(B.ids.status,'json');const newer=!D.status||st.time!=D.status.time;D.status=st;D.live=true;if(WEB)LS.set('status',st);
  const quiet=V.view=='grid'&&!V.selm&&!V.pop&&document.activeElement!==$('#q');
  if(first||(newer&&st.scan_time&&st.scan_time*1>D.time-600&&quiet)){const ix=await B.get(B.ids.index,'json');if(!D.cfg||ix.time!=D.time){if(WEB)CS.put('index',ix);
    if(!D.cfg||quiet){ingest(ix);V._kept=V.shown;render()}else D.next=ix}}
  if(D.next&&quiet){ingest(D.next);D.next=null;V._kept=V.shown;render()}
  renderTop();if(V.stat)statView();if(WEB)setTimeout(()=>B.preload(),1500)}catch(e){if(first)throw e}flush()}
function setupView(msg){$('#app').innerHTML=`<div id="load" style="display:block"><div id="setup"><img src="icon-192.png" alt=""><h1>이글 연결</h1><p>처음 한 번만 Apps Script 웹 앱 주소를 붙여 넣습니다. 주소는 이 폰에만 저장됩니다.</p><input id="gu" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off"><button id="gb">저장하고 시작</button><p class="bad" style="margin-top:10px">${esc(msg||'')}</p></div></div>`;
 $('#gu').value=gasUrl();$('#gb').onclick=()=>{const v=$('#gu').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(v))return setupView('script.google.com 으로 시작해 /exec 로 끝나는 주소를 넣어 주세요.');try{localStorage.setItem('walk_gas_url',v)}catch(e){}location.reload()}}
window.onBridge=()=>{renderTop();refresh(!D.cfg).catch(()=>{})};
addEventListener('message',e=>{const d=e.data;if(!d||d.walkBridge!==1)return;if(!TESTB&&!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)&&e.origin!=='https://script.google.com')return;B.onMsg(d)});
(async()=>{addEventListener('resize',()=>{if(D.cfg){V._kept=V.shown;render()}});
 try{
  if(WEB){if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
   if(/[?&]reset\b/.test(location.search)){try{localStorage.removeItem('walk_gas_url')}catch(e){}}
   if(!okUrl(gasUrl()))return setupView('');
   B.ids=LS.get('ids',{});D.status=LS.get('status',null);const tk=LS.get('tk',null);if(tk&&tk.t&&Date.now()-tk.at<45*60e3&&B.ids.index){B.tok=tk.t;B.tokT=tk.at}const ix=await CS.get('index');if(ix){ingest(ix);render()}      // 저장본으로 즉시 표시
   const live=async()=>{try{if(!(B.tok&&B.ids.index&&B.ids.status))await B.boot();if(!B.ids.index||!B.ids.status){if(!D.cfg)$('#load').innerHTML='<div style="padding:30px">드라이브에서 목록을 찾지 못했습니다.<br>'+esc((B.ids.problems||[]).join(' / '))+'</div>';return}await refresh(true)}
    catch(e){const m=String(e.message||e);if(m=='BRIDGE'||m=='NOURL'){B.need=true;if(D.cfg)renderTop();else{$('#load').innerHTML='<div id="setup" style="padding-top:22vh"><img src="icon-192.png" alt=""><h1>구글 연결이 필요합니다</h1><p>아래 버튼을 누르면 연결 창이 잠깐 열렸다 닫힙니다.</p><button id="gb">구글 연결</button></div>';$('#gb').onclick=()=>B.connect()}}
     else if(!D.cfg)$('#load').innerHTML='<div style="padding:30px">불러오지 못했습니다: '+esc(m)+'</div>'}};
   live();setInterval(()=>{if(B.tok)refresh(false);else if(!B.need)live()},60000);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden&&B.tok)refresh(false)});return}
  const ids=await B.boot();if(!ids.index||!ids.status){$('#load').innerHTML='드라이브에서 목록을 찾지 못했습니다.<br>'+esc((ids.problems||[]).join(' / '));return}
  D.live=true;await refresh(true);setInterval(()=>refresh(false),60000)}catch(e){$('#load').innerHTML='불러오지 못했습니다: '+esc(e.message||e)}})();
